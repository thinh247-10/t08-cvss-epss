# Phase 2 experiment declaration. Selection results live in reports/model_selection.json.
# Keep this file fixed between validation selection and final test evaluation.
schema_version: "0.1"
status: "phase2_experiment_declared"
# Keep this value aligned with project.seed in config/project.yaml.
seed: 42

parameter_selection:
  # All declared model hyperparameters are proposals, not measured optima.
  configured_values: "predeclared_candidates"
  status: "see_reports_model_selection"
  selection_split: "validation"
  # Populate only after a documented validation experiment in Phase 2.
  empirically_selected_parameters: null
  candidates: [{C: 1.0}, {C: 0.5}]
  criterion: "mean_eight_validation_macro_f1_all_declared_labels"
  tie_tolerance: 0.000001
  tie_break: "shorter_training_seconds_then_candidate_order"
  results: "reports/model_selection.json"

data:
  project_config: "config/phase1.yaml"
  dataset_version: "t08-v1.0-20261010"
  dataset: "data/processed/phase1_v1_20261010/ml_cohort.parquet"
  metadata: "data/processed/phase1_v1_20261010/metadata.json"
  evaluation_scope: "report_all_ml_and_in_scope_web_mobile_separately"
  sample: "data/sample/cves_sample.csv"
  # Description is the only feature; IDs/dates are metadata for tracking/split.
  # Source CVSS vectors/scores/labels, EPSS and KEV must never be input features.
  input_column: "description"
  cvss_version: "3.1"
  target_metrics: ["AV", "AC", "PR", "UI", "S", "C", "I", "A"]
  # Use the shared provisional time split; do not duplicate its date bounds.
  split_source: "config/phase1.yaml"
  split_key: "split"
  rejected_policy: "exclude_from_ml_keep_in_master"
  missing_description_policy: "exclude_from_ml_keep_in_master"
  missing_label_policy: "exclude_from_ml_keep_in_master"
  # Final ID selection is frozen in the v1 artifact; do not split again at train time.
  # This describes the fixed module policy, not configurable CLI switches.
  duplicate_policy:
    version: "exact-near-earliest-v1"
    module: "src.model.near_duplicates"
    status: "locked_in_t08_v1"
    rule: "keep_all_in_earliest_period_exclude_later_period_occurrences"
    final_dataset_locked: true

# List positions define zero-based class IDs; save this order with every artifact.
label_order:
  AV: ["N", "A", "L", "P"]
  AC: ["L", "H"]
  PR: ["N", "L", "H"]
  UI: ["N", "R"]
  S: ["U", "C"]
  C: ["N", "L", "H"]
  I: ["N", "L", "H"]
  A: ["N", "L", "H"]

dummy:
  # Fit one DummyClassifier per target metric on train only.
  strategy: "most_frequent"

baseline:
  # Fit one shared TF-IDF vectorizer on train only, then eight independent
  # classifiers, one per target metric; derive balanced weights from train.
  vectorizer: "tfidf"
  ngram_range: [1, 2]
  min_df: 2
  max_features: 50000
  classifier: "logistic_regression"
  class_weight: "balanced"
  C: 1.0
  max_iter: 1000
  single_class_fallback: "dummy"
  preprocessing: "mask_explicit_cvss_v1"

distilbert:
  # Identifier for a future Phase 2 run; Phase 0 does not download weights.
  checkpoint: "distilbert/distilbert-base-uncased"
  # One shared encoder; head sizes follow label_order: 4/2/3/2/2/3/3/3.
  architecture: "shared_encoder_eight_heads"
  lemmatize: false
  max_length: 256
  epochs_cap: 3
  max_runs: 2
  # N3 proposal only; N1/team approval is still pending under decision D05.
  # The 6 hours cover all training runs in total, not 6 hours per run.
  scope_decision: "timeboxed_extension"
  training_time_budget_hours: 6
  execution_status: "not_run"
  gate_status: "D05_pending_backend_and_time_budget_unconfirmed"
  hardware_evidence: "reports/phase2_hardware.json"

evaluation:
  per_metric: ["accuracy", "macro_f1", "per_class_f1", "support"]
  vector: ["exact_vector_accuracy"]
  score: ["mae", "rmse", "score_coverage", "invalid_prediction_count"]
  macro_f1_labels: "all_declared_labels"
  zero_division: 0
  test_usage: "final_evaluation_only"

artifacts:
  baseline: "models/baseline.joblib"
  distilbert_dir: "models/distilbert"
  predictions: "data/processed/predictions.csv"
  metrics: "reports/model_metrics.json"
